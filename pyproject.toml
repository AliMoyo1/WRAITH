[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wraith"
version = "2.1.0"
description = "WRAITH authorization kernel and CLI (Phase 0)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
service = ["fastapi>=0.115", "sqlalchemy>=2.0.41", "uvicorn>=0.30", "argon2-cffi>=23.1"]

[project.scripts]
wraith = "cli.wraith:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Header", "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
